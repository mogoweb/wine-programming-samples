<!DOCTYPE html>
<!-- 必须IE文档模式 -->
<meta http-equiv="X-UA-Compatible" content="IE=8">
<html>
<head>
    <meta charset="utf-8"/>
    <title>PageOffice5.x ActiveX内嵌示例</title>
    <!-- pageoffice.js 由后端poserver.zz输出 -->
    <script src="/pageoffice.js" type="text/javascript"></script>
    <script>
        //保存回调
        function Save(){
            //PageOfficeCtrl1 就是object控件id
            document.getElementById("PageOfficeCtrl1").WebSave();
        }
        //控件初始化回调
        function OnPageOfficeCtrlInit(){
            var po = document.getElementById("PageOfficeCtrl1");
            //添加保存按钮
            po.AddCustomToolButton("保存文档","Save()",1);
        }
    </script>
</head>
<body>
    <h3>Word文档内嵌页面</h3>
    <!-- ==========核心ActiveX Object标签，网页内联Office窗口 ========== -->
    <object id="PageOfficeCtrl1"
        classid="CLSID:9E49D698-C5C6-47BE-8C99-432B5E5D2A91"
        width="100%"
        height="850px"
        >
        <param name="ServerPage" value="/poserver.zz" />
        <param name="SaveFilePage" value="/saveDoc" />
        <!-- IE未安装控件时提示文字 -->
        <div>请先安装PageOffice5客户端, 并且使用IE浏览器打开此页面</div>
    </object>
</body>
</html>
