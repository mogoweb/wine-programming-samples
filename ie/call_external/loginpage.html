<script>
var preCode ;
var accCode ;
var pwd ;
var currareaId ;
var currcounterId ;
var currcounterName;
var flag=false;

$(function(){
	
	$('#accCode').focusout(function(){
		var code = Trim($(this).val());
		if(!!code){	
			if(code != preCode){	
				currareaId = null ;
				currcounterId = null;
				currcounterName = null;			
				$('#counter').text('');
				$('.seldiv2').text('');		
				$('#pwd').val('');
				$('.box[uid=2]').each(function(){
					$(this).removeClass('box_checked').attr('uid',1);
				});
				listareas(code);														
			}
		}else{	
			currareaId = null ;
			currcounterId = null;
			currcounterName = null;
			$('#pwd').val('');
			$('#area').text('');
			$('#counter').text('');
			$('.seldiv').text('');
			$('.seldiv2').text('');	
			$('.box[uid=2]').each(function(){
				$(this).removeClass('box_checked').attr('uid',1);
			});
		}
		preCode = code;
	});
	
	
	
	$('#btn_exit').click(function(){ 
		QASUI.setmodalresult(2);
	});
	$('#btn_x').click(function(){
		QASUI.setmodalresult(2);
	});
	$('#movehandler').mousedown(function(){
		QASUI.dragwindow();
	});
	$('#btn_login').click(function(){
		$('#btn_login').attr('disabled', true);
		accCode = $('#accCode').val();
		pwd = $('#pwd').val(); 
		if(!accCode){
			alert('请输入用户账号');
			$('#btn_login').attr('disabled', false);
			return ;
		}else if(!pwd){
			alert('请输入密码');
			$('#btn_login').attr('disabled', false);
			return;
		}else if(!currcounterId){
			alert('不可登录');
			$('#btn_login').attr('disabled', false);
			return;
		}else if(flag){
			alert('用户不存在');
			$('#btn_login').attr('disabled', false);
			return;
		}
		DoLogin();
	});

	$('#btn_x').hover(
		function(){			
			$(this).addClass('btn_x_hover');
		},		
		function(){
			$(this).removeClass('btn_x_hover');
		}
	);
	$('.tdinput').hover(
			function(){$(this).addClass('text_hover');},
			function(){$(this).removeClass('text_hover');}
	);
 	$('#select1').hover(
 		function(){
			$(this).addClass('s1_hover');
		},
		function(){
			$(this).removeClass('s1_hover');
		}
	);

	$('#select1 .selbtn').mousedown(function(){
		var cid = $('.seldiv').attr('uid');
		if(1 == cid){
			$(this).addClass('selbtn_click');
			$('.seldiv').show();
			$('.seldiv').attr('uid',2);
			$('.seldiv').focus();
		}else{
			$(this).removeClass('selbtn_click');	
			$('.seldiv').attr('uid',1);
			$('.seldiv').hide();
		}
		
	});
	$('.seldiv').focusout(function(){
		$('#select1 .selbtn').removeClass('selbtn_click');
		$(this).attr('uid',1);
		$(this).hide();
	});
	$('#select2').hover(
		function(){
			$(this).addClass('s2_hover');
		},
		function(){
			$(this).removeClass('s2_hover');
		}
	);
	$('.selbtn').hover(
			function(){
				$(this).addClass('selbtn_hover');
			},
			function(){
				$(this).removeClass('selbtn_hover');
			}
	);
	
	$("#select2 .selbtn").mousedown(function(){ 
		var cid = $('.seldiv2').attr('uid'); 
		if(1 == cid){
			$(this).addClass('selbtn_click');
			$('.seldiv2').show();
			$('.seldiv2').attr('uid',2);
			$('.seldiv2').focus();
		}else{
			$(this).removeClass('selbtn_click');			
			$('.seldiv2').attr('uid',1);
			$('.seldiv2').hide();
		}
		
	});
	$('.seldiv2').focusout(function(){
		$("#select2 .selbtn").removeClass('selbtn_click');
		$(this).attr('uid',1);
 		$(this).hide();
	});
	
	$("#savepwd").click(function(){
		if(1 == $(this).attr("uid")){
			$(this).addClass('box_checked').attr('uid',2);
		}else{
			$(this).removeClass('box_checked').attr('uid',1);
			if(2 == $("#autologin").attr("uid")){
				$("#autologin").removeClass('box_checked').attr('uid',1);
			}
		} 	
	});
	$("#autologin").click(function(){
		if(1 == $(this).attr("uid")){
			$(this).addClass('box_checked').attr('uid',2);
			if(1 == $("#savepwd").attr("uid")){
				$("#savepwd").addClass('box_checked').attr('uid',2);
			}
		}else{
			$(this).removeClass('box_checked').attr('uid',1);
		} 	
	});
	$("#autohide").click(function(){
		if(1 == $(this).attr("uid")){
			$(this).addClass('box_checked').attr('uid',2);
		}else{
			$(this).removeClass('box_checked').attr('uid',1);
		} 	
	});
	//初始化	
	init();	
});

function init(){
	$.ajax({
		url:'uac/findByKey.json?key=copyright',
		cache: false,
		type:'GET',
		dataType: 'json',
		success: function(data) {
			if (!!data && !!data.Data) {
				$("#copyright").text(data.Data.value);
			}
		}
	});
	accCode = !!getCookie("accCode") ? getCookie("accCode") : null ;
	pwd = !!getCookie("password") ? getCookie("password") : null ;
	currareaId = !!getCookie("areaId") ? getCookie("areaId") : null ;
	currcounterId = !!getCookie("counterId") ? getCookie("counterId") : null ;	
	currcounterName = !!getCookie("counterName") ? getCookie("counterName"):null;
	if(!!accCode){ 
		$('#accCode').val(accCode);
		preCode = accCode;
		listareas(accCode);
	}else{
		$('#accCode').focus();
	}
	if(!!getCookie("savepwd")){
		$("#savepwd").addClass('box_checked').attr('uid',2);
		$('#pwd').val(pwd);
	}
	if(!!getCookie("autohide")){
		$("#autohide").addClass('box_checked').attr('uid',2);
	}    

	if(!!getCookie("autologin")){
		$("#autologin").addClass('box_checked').attr('uid',2);
		if(GetParame("fromLogout")==0){
			setTimeout(function(){
				DoLogin();
			},5);
		}
	}
}

function DoLogin(){
	var data = {};
	data['accCode'] = accCode;
	data['pwd'] = pwd;
	data['counterId'] = currcounterId ;			
	var xhr = $.ajax({
		url:'uac/login.json',
		data: data,
		cache: false,
		type:'POST',
		dataType: 'json'
	});
	xhr.done(function(data){
		if(data['Code'] == '0'){
			var d = data['Data'];
			var accName = d.accName;
			var counterName = d.counterName;
			var counterFunc = d.counterFunc;
			setCookie("accCode",accCode,getExpDate(30,0,0));
			setCookie("areaId",currareaId,getExpDate(30,0,0));
			setCookie("counterId",currcounterId,getExpDate(30,0,0));
			setCookie("counterName",currcounterName,getExpDate(30,0,0));
			setCookie("password",pwd,getExpDate(30,0,0));


			$('.box').each(function(){
				if(2 == $(this).attr('uid')){
					if(!getCookie($(this).attr('id'))){
						setCookie($(this).attr('id'),2,getExpDate(30,0,0));
					}
				}else{
					deleteCookie($(this).attr('id'));
				}
				
			});
			
			var infoFlag = 2;
			var countDownFlag = 1;
			var autoHideFlag = 1;
			var dealInfoType = 1;
			var autoPopupNoteDetail = 1;
			var countDownWithSecFlag = 1;

			if(!!getCookie('displayInfo')){
				infoFlag = getCookie('displayInfo');
			}else{
				setCookie('displayInfo',2,getExpDate(30,0,0));
			}
			// 暂时强制禁用倒计窗口
			//setCookie('displayCountDown',1,getExpDate(30,0,0));
			
			if(!!getCookie('displayCountDown')){
				countDownFlag = getCookie('displayCountDown');
			}else{
				setCookie('displayCountDown',1,getExpDate(30,0,0));
			}
			
			if(!!getCookie('displayCountDownWithSec')){
				countDownWithSecFlag = getCookie('displayCountDownWithSec');
			}else{
				setCookie('displayCountDownWithSec',1,getExpDate(30,0,0));
			}

			if(!!getCookie('autoHide')){
				autoHideFlag = getCookie('autoHide');
			}else{
				setCookie('autoHide',1,getExpDate(30,0,0));
			}
			
			if(!!getCookie('dealInfoType')){
				dealInfoType = getCookie('dealInfoType');
			}else{
				setCookie('dealInfoType',1,getExpDate(30,0,0));
			}
			
			if(!!getCookie('autoPopupNoteDetail')){
				autoPopupNoteDetail = getCookie('autoPopupNoteDetail');
			}else{
				setCookie('autoPopupNoteDetail',1,getExpDate(30,0,0));
			}
			//hiddenTItemName的值为2表示隐藏业务名称
			var hiddenTItemName = d.hiddenTItemName;
			if(!!hiddenTItemName && hiddenTItemName === 2){
				QASUI.setWaitCountShowType(hiddenTItemName);
			}
			QASUI.setuasession(d.sessionId);
			QASUI.setmodalresult(1);
			QASUI.enableinfowindow(infoFlag);
			QASUI.enablecountdownwindow(countDownFlag);
			QASUI.enableautohide(autoHideFlag);
			QASUI.setDealInfoType(dealInfoType);
			QASUI.enableCountDownWithSec(countDownWithSecFlag);
			QASUI.enableAutoPopupNoteDetail(autoPopupNoteDetail);
		}else{
			alert(data['Message']);
		}
		$('#btn_login').attr('disabled', false);
	}).fail(function(xhr, statue, error){
		$('#btn_login').attr('disabled', false);
		alert(error);
	});
}
function Trim(str){ 
	var result = str.replace(/(^\s+)|(\s+$)/g,"");
	return result.replace(/\s/g, ""); 
}
function listareas(code){ 
	$.ajax({
		url:'uac/getareas.json?accCode='+code,
		cache:false,
		aysnc:false,
		dataType: 'json',
		success:function(data){
			var d = data.Data; 
			$('#area').text('');
			$('.seldiv').text('');
			$('.seldiv').removeClass('div_height');
			if(!!d&&null!=d&&""!=d){
				flag=false;
				var areatext = '';
				var temp = "<div><ul>" ;
				for(i=0;i<d.length;i++){
					var areaId = d[i].areaId;  
					var areaName = d[i].areaName;
					if(!!currareaId){
						if(currareaId == areaId){
							$("#area").text(areaName);
						}
					}else{
						if(0 == i){
							$("#area").text(areaName);
							currareaId = areaId;
						}
					}
					temp += '<li class="areali" id="'+areaId+'">'+areaName+'</li>';									
				}
				temp += "</ul></div>";
				$('.seldiv').html(temp);
				
				var areaheight = $('.seldiv').height();
				if(areaheight > 103){
					$('.seldiv').addClass('div_height');
				}
				
				$(".areali").hover(
					function(){$(this).addClass('li_bgcolor');},		
					function(){$(this).removeClass('li_bgcolor');}
				);
				$(".areali").click(function(e){
					$("#select1 .selbtn").removeClass('selbtn_click');  
					var temp = $(this).attr('id');  
					if(temp != currareaId){ 						
						$("#area").text($(this).text()); 
						currcounterId = null;
						currcounterName = null ;
						listcounters(temp);
						currareaId = temp;
					}
					$('.seldiv').hide();	
				});
				if(!!currareaId){
					listcounters(currareaId);
				}
			}else{
				flag=true;
				//deleteCookie("autologin");
				removeCookie("autologin");
				alert("用户不存在");
			}
		}
	});   

}
//获取URL传递参数
function GetParame(name) { 
	var s = document.location.search;
	var r = new RegExp("^\\?(?:" + name + "=|.+=.*&" + name + "=)([^&]+).*",
			"i");
	if (r.test(s)) {
		return s.replace(r, "$1");
	} else {
		return "";
	}
}
function listcounters(aid){
	$.ajax({
		url:'uac/getareacounters.json?areaId='+aid,
		cache:false,
		aysnc:false,
		dataType: 'json',
		success:function(data){  
			var d = data.Data; 
			if(!!currcounterName){
				$('#counter').text(currcounterName);
			}else{
				$('#counter').text('');
			}
			$('.seldiv2').text('');
			$('.seldiv2').removeClass('div_height');
			if(!!d){
				var t = "<ul>" ;
				for(i=0;i<d.length;i++){
					var counId = d[i].counterId;
					var counName = d[i].counterName;  
					if( !currcounterId && 0 == i){
						$("#counter").text(counName);
						currcounterId = counId;
						currcounterName = counName;					
					}
					t += '<li class="counterli" id="'+counId+'">'+counName+'</li>';																
				}
				t += "</ul>";
				$('.seldiv2').html(t);
				
				var areaheight = $('.seldiv2').height();
				if(areaheight > 103){
					$('.seldiv2').addClass('div_height');
				}
				
				$(".counterli").hover(
						function(){$(this).addClass('li_bgcolor');},		
						function(){$(this).removeClass('li_bgcolor');}
					);
				$(".counterli").click(function(){
						currcounterId = $(this).attr('id');
						currcounterName = $(this).text();
						$("#counter").text($(this).text());
						doCounter(currcounterId);
						$('.seldiv2').hide();	
						$("#select2 .selbtn").removeClass('selbtn_click');

				});

			}
		}
		
	});
}

function doCounter(counterId) {
	$.ajax({
		url:'uac/TaskSoecItemByCounterId.json?counterId='+counterId,
		cache : false,
		aysnc : false,
		dataType : 'json',
		success : function(data){
			if (data['Data']==1){
				alert("您选择登录的窗口没有可办理业务")
			}
		}
	})
}

function canSelect() {
	window.event.cancelBubble = true;
	window.event.returnValue = true; 
	return true;
}
